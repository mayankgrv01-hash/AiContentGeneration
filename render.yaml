services:
  # Web API server
  - type: web
    name: nexus-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: AI_PROVIDER
        value: openrouter
      - key: AI_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: DISCOVERY_INTERVAL_MINUTES
        value: 30
      - key: PUBLISH_THRESHOLD
        value: 75

  # Autonomous scheduler — runs one cycle every 15 minutes via Render Cron Job
  - type: cron
    name: nexus-scheduler
    env: python
    region: oregon
    plan: free
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python run_cycle.py
    envVars:
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: AI_PROVIDER
        value: openrouter
      - key: AI_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: PUBLISH_THRESHOLD
        value: 75
